name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, draft]

# 同時に走ると後から終わった方が本番を上書きする（古い中身で戻ることがある）ため、ブランチごとに1本ずつ流す
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          INCLUDE_DRAFTS: ${{ github.ref_name == 'draft' && 'true' || 'false' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name pokenavi --branch ${{ github.ref_name }} --commit-dirty=true --commit-message="deploy"
