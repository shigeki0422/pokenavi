name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, draft]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          INCLUDE_DRAFTS: ${{ github.ref_name == 'draft' && 'true' || 'false' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name pokenavi --commit-dirty=true --commit-message="deploy"
